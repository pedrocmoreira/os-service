apiVersion: apps/v1
kind: Deployment
metadata:
  name: os-service
  namespace: garage
  labels: {app: os-service}
spec:
  replicas: 1
  selector: {matchLabels: {app: os-service}}
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  template:
    metadata:
      labels: {app: os-service}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /actuator/prometheus
        prometheus.io/port: "8081"
    spec:
      containers:
        - name: os-service
          # A pipeline de CI/CD substitui a imagem com "kubectl set image" (tag = SHA do commit)
          image: ghcr.io/pedrocmoreira/os-service:latest
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 8081}]
          envFrom:
            - configMapRef: {name: os-service-config}
          env:
            - name: RABBITMQ_USER
              valueFrom: {secretKeyRef: {name: garage-secrets, key: RABBITMQ_USER}}
            - name: RABBITMQ_PASSWORD
              valueFrom: {secretKeyRef: {name: garage-secrets, key: RABBITMQ_PASSWORD}}
            - name: JWT_SECRET
              valueFrom: {secretKeyRef: {name: garage-secrets, key: JWT_SECRET}}
            - name: DB_NAME
              valueFrom: {secretKeyRef: {name: garage-secrets, key: OS_DB_NAME}}
            - name: DB_USER
              valueFrom: {secretKeyRef: {name: garage-secrets, key: OS_DB_USER}}
            - name: DB_PASSWORD
              valueFrom: {secretKeyRef: {name: garage-secrets, key: OS_DB_PASSWORD}}
            - name: ADMIN_USERNAME
              valueFrom: {secretKeyRef: {name: garage-secrets, key: ADMIN_USERNAME}}
            - name: ADMIN_PASSWORD
              valueFrom: {secretKeyRef: {name: garage-secrets, key: ADMIN_PASSWORD}}
          startupProbe:
            httpGet: {path: /actuator/health/liveness, port: 8081}
            periodSeconds: 5
            failureThreshold: 36
          livenessProbe:
            httpGet: {path: /actuator/health/liveness, port: 8081}
            periodSeconds: 15
          readinessProbe:
            httpGet: {path: /actuator/health/readiness, port: 8081}
            periodSeconds: 10
          resources:
            requests: {cpu: 200m, memory: 384Mi}
            limits: {memory: 768Mi}
